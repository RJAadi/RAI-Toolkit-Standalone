apiVersion: v1
kind: ConfigMap
metadata:
  name: responsible-ai-moderation-layer-config
  namespace: irai-toolkit-test
  labels:
    app: responsible-ai-moderation-layer
data:
  LOGCHECK: "TRUE"
  PORT: "8000"
  VAULTNAME: "${vault}"
  ISVAULT: "${isvault}"
  AZURE_VAULT_TENANT_ID: "${azurevaulttenantid}"
  AZURE_VAULT_CLIENT_ID: "${azurevaultclientid}"
  VAULT_SECRET: "${VAULT_SECRET}"
  KEYVAULTURL: "${KEYVAULTURL}"
  APP_VAULT_BACKEND: "${APP_VAULT_BACKEND}"
  APP_VAULT_ROLE_ID: "${APP_VAULT_ROLE_ID}"
  APP_VAULT_SECRET_ID: "${APP_VAULT_SECRET_ID}"
  APP_VAULT_PATH: "${APP_VAULT_PATH}"
  APP_VAULT_URL: "${APP_VAULT_URL}"
  APP_VAULT_KEY_MONGOUSER: "${APP_VAULT_KEY_MONGOUSER}"
  APP_VAULT_KEY_MONGOPASS: "${APP_VAULT_KEY_MONGOPASS}"
  APP_MONGO_HOST: "localhost"
  #APP_MONGO_HOST: "mongodb-service:27017"
  APP_MONGO_DBNAME: "moderationDB"
  COSMOS_PATH: "${cosmos_path}"
  TEL_FLAG: "FALSE"
  IS_TELEMETRY_ENDPOINT: "${isendpoint}"
  IS_PDATA_ID: "${ispdataid}"
  IS_PDATA_VER: "${ispdataver}"
  IS_PDATA_PID: "${ispdatapid}"
  IS_ENV: "${isenv}"
  ETA_TELEMETRY_ENDPOINT: "${etaendpoint}"
  ETA_TELEMETRY_USERNAME: "${etausername}"
  ETA_TELEMETRY_PASSWORD: "${etapassword}"
  TELEMETRY_ENVIRONMENT: "${telemetryenviron}"
  BLOOM_ENDPOINT: "${bloomendpoint}"
  LLAMA_ENDPOINT: "${llamaendpoint}"
  MODEL_NAME: "${modelname}"
  OPENAI_API_TYPE: "${apitype}"
  OPENAI_API_BASE_GPT3: "${apibase_gpt3}"
  OPENAI_API_KEY_GPT3: "${apikey_gpt3}"
  OPENAI_API_VERSION_GPT3: "${apiversion_gpt3}"
  OPENAI_MODEL_GPT3: "${openaimodel_gpt3}"
  OPENAI_API_BASE_GPT4: "${apibase_gpt4}"
  OPENAI_API_KEY_GPT4: "${apikey_gpt4}"
  OPENAI_API_VERSION_GPT4: "${apiversion_gpt4}"
  OPENAI_MODEL_GPT4: "${openaimodel_gpt4}"
  OPENAI_API_BASE_GPT4_O: "${api_base}"
  OPENAI_API_KEY_GPT4_O: "${api_key}"
  OPENAI_API_VERSION_GPT4_O: "${api_version}"
  OPENAI_MODEL_GPT4_O: "${model}"
  PRIVACY: "http://responsible-ai-moderation-model:8000/rai/v1/raimoderationmodels/privacy"
  SIMILARITYMODEL: "http://responsible-ai-moderation-model:8000/rai/v1/raimoderationmodels/similarity"
  RESTRICTEDMODEL: "http://responsible-ai-moderation-model:8000/rai/v1/raimoderationmodels/restrictedtopicmodel"
  DETOXIFYMODEL: "http://responsible-ai-moderation-model:8000/rai/v1/raimoderationmodels/detoxifymodel"
  PROMPTINJECTIONMODEL: "http://responsible-ai-moderation-model:8000/rai/v1/raimoderationmodels/promptinjectionmodel"
  JAILBREAKMODEL: "http://responsible-ai-moderation-model:8000/rai/v1/raimoderationmodels/multi_q_net_embedding"
  SIMILARITYMODELRAI: "${similarity_model_rai}"
  RESTRICTEDMODELRAI: "${restricted_model_rai}"
  DETOXIFYMODELRAI: "${detoxify_model_rai}"
  PROMPTINJECTIONMODELRAI: "${detoxify_model_rai}"
  JAILBREAKMODELRAI: "${jailbreak_model_rai}"
  PRIVACYRAI: "${privacy_rai}"
  TARGETENVIRONMENT: "azure"
  TELEMETRY_PATH: "${telemetrypath}"
  COUPLEDTELEMETRYPATH: "${coupledtelemetrypath}"
  ADMINTEMPLATEPATH: "${adminTemplatepath}"
  EVALLLMTELEMETRYPATH: "${evalllmtelemetrypath}"
  DB_USERNAME: "mongouser"
  DB_PWD: "mongopw123"
  DBTYPE: "mongo"
  AZURE_TRANSLATE_KEY: "${azuretranslatekey}"
  AZURE_TRANSLATE_ENDPOINT: "${azuretranslateendpoint}"
  AZURE_TRANSLATE_REGION: "${azuretranslateregion}"
  TENANT_ID: "${tenant_id}"
  CLIENT_ID: "${client_id}"
  CLIENT_SECRET: "${client_secret}"
  AUTH_URL: "${auth_url}"
  SCOPE: "${scope}"
  #MONGO_PATH: "mongodb://${DB_USERNAME}:${DB_PWD}@${APP_MONGO_HOST}/"
  MONGO_PATH: "mongodb://mongouser:mongopw123@mongodb-service:27017/"
  CACHE_TTL: "100"
  CACHE_SIZE: "150"
  CACHE_FLAG: "FALSE"
  EXE_CREATION: "${exe_creation}"

---
apiVersion: v1
kind: Service
metadata:
  name: responsible-ai-moderation-layer
  namespace: irai-toolkit-test
  labels:
    app: responsible-ai-moderation-layer
spec:
  type: ClusterIP
  ports:
    - port: 8001
      targetPort: 8000
  selector:
    app: responsible-ai-moderation-layer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: responsible-ai-moderation-layer
  namespace: irai-toolkit-test
  labels:
    app: responsible-ai-moderation-layer
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: responsible-ai-moderation-layer
      version: v1
  template:
    metadata:
      labels:
        app: responsible-ai-moderation-layer
        version: v1
    spec:
      volumes:
        - name: logs-volume
          emptyDir: {} # Temporary storage for logs
      containers:
        - name: responsible-ai-moderation-layer
          image: rjaadi001/rai_mod_layer_amd64:v2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: responsible-ai-moderation-layer-config
          volumeMounts:
            - mountPath: "/responsible-ai/logs"
              name: logs-volume
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              cpu: "1"
              memory: "2Gi"
            requests:
              cpu: "0.5"
              memory: "1Gi"
