apiVersion: v1
kind: ConfigMap
metadata:
  name: admin-config
  namespace: irai-toolkit-test
data:
  AZUREADDFILE: "<azureaddfileurl>"
  CONTAINERNAME: "<containername>"
  DB_NAME: "<dbname>"
  DB_IP: "<ipaddress>"
  DB_PORT: "<port>"
  DB_TYPE: "<dbtype>"
  RAG_IP: "<rag_ip>"
  COSMOS_PATH: "<cosmos_path>"
  MONGO_PATH: "mongodb://mongouser:mongopw123@mongodb-service:27017/"
  RECOG_LIST: |
    ["PERSON","LOCATION","DATE","AU_ABN", "AU_ACN", "AADHAR_NUMBER", "AU_MEDICARE", "AU_TFN", "CREDIT_CARD", "CRYPTO", "DATE_TIME", "EMAIL_ADDRESS", "ES_NIF", "IBAN_CODE", "IP_ADDRESS", "IT_DRIVER_LICENSE", "IT_FISCAL_CODE", "IT_IDENTITY_CARD", "IT_PASSPORT", "IT_VAT_CODE", "MEDICAL_LICENSE", "PAN_Number", "PHONE_NUMBER", "SG_NRIC_FIN", "UK_NHS", "URL", "PASSPORT", "US_ITIN", "US_PASSPORT", "US_SSN","Face_Detect"]
  allow_origin: "*"
  allow_method: "GET, POST, OPTIONS, HEAD, DELETE, PATCH, UPDATE"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: responsible-ai-admin
  namespace: irai-toolkit-test
  labels:
    app: responsible-ai-admin
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: responsible-ai-admin
      version: v1
  template:
    metadata:
      labels:
        app: responsible-ai-admin
        version: v1
    spec:
      automountServiceAccountToken: false
      serviceAccountName: responsible-ai-reporting-tool-sa
      imagePullSecrets:
        - name: docker-secret
      containers:
        - name: responsible-ai-admin
          image: <your-image-name>  # e.g., myrepo/responsible-ai-admin:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 30016
          envFrom:
            - configMapRef:
                name: admin-config
            - secretRef:
                name: admin-secret
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            limits:
              cpu: "1"
              memory: "3Gi"
            requests:
              cpu: "500m"
              memory: "1Gi"

---

apiVersion: v1
kind: Service
metadata:
  name: responsible-ai-admin
  namespace: irai-toolkit-test
  labels:
    app: responsible-ai-admin
spec:
  type: ClusterIP
  ports:
    - port: 30016
      targetPort: 30016
  selector:
    app: responsible-ai-admin
